{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-tasks"></i>
            <h3>TaskFlow</h3>
            <p style="font-size: 12px; opacity: 0.8;">Team Productivity Suite</p>
        </div>
        <div class="sidebar-menu">
            <button class="menu-btn active" onclick="showSection('dashboard', this)">
                <i class="fas fa-chart-line"></i> Dashboard
            </button>
            <button class="menu-btn" onclick="showSection('projects', this)">
                <i class="fas fa-folder"></i> Projects
            </button>
            <button class="menu-btn" onclick="showSection('tasks', this)">
                <i class="fas fa-tasks"></i> Tasks
            </button>
            <button class="menu-btn" onclick="showSection('team', this)">
                <i class="fas fa-users"></i> Team
            </button>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="username-display"></span>
                <small id="role-display"></small>
            </div>
            <button onclick="handleLogout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <main class="main-content">
        <div id="dashboard-section" class="section active">
            <div class="section-header">
                <h2><i class="fas fa-chart-pie"></i> Analytics Dashboard</h2>
                <div class="date-badge" id="current-date"></div>
            </div>
            <div class="stats-grid" id="stats-grid"></div>
            <div class="recent-tasks">
                <h3><i class="fas fa-clock"></i> Recent Activities</h3>
                <div id="recent-tasks-list"></div>
            </div>
        </div>
        
        <div id="projects-section" class="section">
            <div class="section-header">
                <h2><i class="fas fa-folder-open"></i> Projects Gallery</h2>
                <button onclick="showCreateProjectModal()" class="btn-primary" style="width: auto; padding: 12px 24px;">
                    <i class="fas fa-plus"></i> New Project
                </button>
            </div>
            <div id="projects-list" class="projects-grid"></div>
        </div>
        
        <div id="tasks-section" class="section">
            <div class="section-header">
                <h2><i class="fas fa-check-circle"></i> Task Board</h2>
                <button onclick="showCreateTaskModal()" class="btn-primary" style="width: auto; padding: 12px 24px;">
                    <i class="fas fa-plus"></i> New Task
                </button>
            </div>
            <div id="tasks-list" class="tasks-container"></div>
        </div>
        
        <div id="team-section" class="section">
            <div class="section-header">
                <h2><i class="fas fa-user-friends"></i> Team Collaboration</h2>
            </div>
            <div id="team-members-list"></div>
        </div>
    </main>
</div>

<!-- Modals -->
<div id="project-modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('project-modal')">&times;</span>
        <h3><i class="fas fa-rocket"></i> Launch New Project</h3>
        <form id="project-form" onsubmit="createProject(event)">
            <input type="text" id="project-name" placeholder="Project Name *" required>
            <textarea id="project-desc" placeholder="Project Description" rows="4"></textarea>
            <button type="submit" class="btn-primary">Create Project →</button>
        </form>
    </div>
</div>

<div id="task-modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('task-modal')">&times;</span>
        <h3><i class="fas fa-plus-circle"></i> Create Task</h3>
        <form id="task-form" onsubmit="createTask(event)">
            <input type="text" id="task-title" placeholder="Task Title *" required>
            <textarea id="task-desc" placeholder="Task Description" rows="3"></textarea>
            <select id="task-project" required>
                <option value="">Select Project</option>
            </select>
            <select id="task-assignee" required>
                <option value="">Assign To</option>
            </select>
            <select id="task-priority">
                <option value="low">🟢 Low Priority</option>
                <option value="medium" selected>🟡 Medium Priority</option>
                <option value="high">🔴 High Priority</option>
            </select>
            <input type="datetime-local" id="task-due-date" required>
            <button type="submit" class="btn-primary">Create Task →</button>
        </form>
    </div>
</div>

<script>
let currentUser = null;

// Display current date
const dateElement = document.getElementById('current-date');
if (dateElement) {
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    dateElement.innerHTML = `<i class="far fa-calendar-alt"></i> ${new Date().toLocaleDateString(undefined, options)}`;
    dateElement.style.cssText = 'padding: 8px 16px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 12px; color: white; font-size: 14px;';
}

function showNotification(message, type = 'success') {
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.innerHTML = `
        <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
        <span>${message}</span>
    `;
    notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        z-index: 10000;
        animation: slideInRight 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
        border-left: 4px solid ${type === 'success' ? '#10b981' : '#ef4444'};
    `;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 3000);
}

async function loadUserInfo() {
    try {
        const response = await fetch('/api/user');
        if (response.ok) {
            currentUser = await response.json();
            document.getElementById('username-display').textContent = currentUser.username;
            const roleDisplay = document.getElementById('role-display');
            roleDisplay.textContent = currentUser.role.toUpperCase();
            if (currentUser.role === 'admin') {
                roleDisplay.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
                roleDisplay.style.padding = '2px 8px';
                roleDisplay.style.borderRadius = '20px';
                roleDisplay.style.fontSize = '10px';
                roleDisplay.style.display = 'inline-block';
            }
        } else {
            window.location.href = '/';
        }
    } catch (error) {
        console.error('Error loading user info:', error);
        window.location.href = '/';
    }
}

async function loadDashboard() {
    try {
        const response = await fetch('/api/dashboard/stats');
        const stats = await response.json();
        
        const statsGrid = document.getElementById('stats-grid');
        statsGrid.innerHTML = `
            <div class="stat-card" onclick="showSection('tasks', null)">
                <i class="fas fa-tasks"></i>
                <h3>${stats.total_tasks}</h3>
                <p>Total Tasks</p>
            </div>
            <div class="stat-card" onclick="showSection('tasks', null)">
                <i class="fas fa-check-circle"></i>
                <h3>${stats.completed_tasks}</h3>
                <p>Completed</p>
            </div>
            <div class="stat-card" onclick="showSection('tasks', null)">
                <i class="fas fa-spinner"></i>
                <h3>${stats.pending_tasks}</h3>
                <p>Pending</p>
            </div>
            <div class="stat-card" onclick="showSection('tasks', null)">
                <i class="fas fa-chart-line"></i>
                <h3>${Math.round(stats.completion_rate)}%</h3>
                <p>Completion Rate</p>
                <div style="width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; margin-top: 8px;">
                    <div style="width: ${stats.completion_rate}%; height: 100%; background: linear-gradient(90deg, #10b981, #059669); border-radius: 2px;"></div>
                </div>
            </div>
            <div class="stat-card warning" onclick="showSection('tasks', null)">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>${stats.overdue_tasks}</h3>
                <p>Overdue Tasks</p>
            </div>
            <div class="stat-card" onclick="showSection('projects', null)">
                <i class="fas fa-folder"></i>
                <h3>${stats.total_projects}</h3>
                <p>Active Projects</p>
            </div>
        `;
        
        // Load recent tasks
        const tasksResponse = await fetch('/api/tasks');
        const tasks = await tasksResponse.json();
        const recentTasks = tasks.slice(0, 5);
        
        const recentTasksList = document.getElementById('recent-tasks-list');
        if (recentTasks.length === 0) {
            recentTasksList.innerHTML = '<div style="text-align: center; padding: 40px; color: #718096;">🎉 No tasks yet! Create your first task.</div>';
        } else {
            recentTasksList.innerHTML = recentTasks.map(task => `
                <div class="task-item">
                    <div class="task-info">
                        <strong>${task.title}</strong>
                        <span class="task-status status-${task.status}">${task.status}</span>
                    </div>
                    <div class="task-meta">
                        <span><i class="fas fa-folder"></i> ${task.project_name}</span>
                        <span><i class="fas fa-user"></i> ${task.assignee_name}</span>
                        <span><i class="fas fa-calendar"></i> ${new Date(task.due_date).toLocaleDateString()}</span>
                        ${task.is_overdue ? '<span style="color: #ef4444;"><i class="fas fa-exclamation-circle"></i> Overdue</span>' : ''}
                    </div>
                </div>
            `).join('');
        }
    } catch (error) {
        console.error('Error loading dashboard:', error);
    }
}

async function loadProjects() {
    try {
        const response = await fetch('/api/projects');
        const projects = await response.json();
        
        const projectsList = document.getElementById('projects-list');
        if (projects.length === 0) {
            projectsList.innerHTML = '<div style="text-align: center; padding: 40px;">📁 No projects yet. Create your first project!</div>';
        } else {
            projectsList.innerHTML = projects.map(project => `
                <div class="project-card">
                    <div>
                        <h3>${project.name}</h3>
                        <p>${project.description || 'No description'}</p>
                        <div class="project-stats">
                            <span><i class="fas fa-tasks"></i> ${project.task_count} tasks</span>
                            <span><i class="fas fa-check"></i> ${project.completed_tasks} completed</span>
                        </div>
                        <small>👤 Owner: ${project.owner_name}</small>
                        ${currentUser && (currentUser.role === 'admin' || project.created_by === currentUser.id) ? `
                            <div style="margin-top: 10px;">
                                <button onclick="deleteProject(${project.id})" class="btn-danger-small">Delete</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }
    } catch (error) {
        console.error('Error loading projects:', error);
    }
}

async function loadTasks() {
    try {
        const response = await fetch('/api/tasks');
        const tasks = await response.json();
        
        const tasksList = document.getElementById('tasks-list');
        if (tasks.length === 0) {
            tasksList.innerHTML = '<div style="text-align: center; padding: 40px;">✅ No tasks yet. Create your first task!</div>';
        } else {
            tasksList.innerHTML = tasks.map(task => `
                <div class="task-card ${task.is_overdue ? 'overdue' : ''}">
                    <div class="task-header">
                        <h4>${task.title}</h4>
                        <select onchange="updateTaskStatus(${task.id}, this.value)" class="status-select">
                            <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="in-progress" ${task.status === 'in-progress' ? 'selected' : ''}>🔄 In Progress</option>
                            <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>✅ Completed</option>
                        </select>
                    </div>
                    <p>${task.description}</p>
                    <div class="task-details">
                        <span class="priority-${task.priority}"><i class="fas fa-flag"></i> ${task.priority}</span>
                        <span><i class="fas fa-user"></i> Assigned to: ${task.assignee_name}</span>
                        <span><i class="fas fa-calendar"></i> Due: ${new Date(task.due_date).toLocaleDateString()}</span>
                        ${task.is_overdue ? '<span class="overdue-badge">⚠️ Overdue!</span>' : ''}
                    </div>
                    ${currentUser && (currentUser.role === 'admin' || task.created_by === currentUser.id) ? `
                        <button onclick="deleteTask(${task.id})" class="btn-danger-small" style="margin-top: 10px;">Delete Task</button>
                    ` : ''}
                </div>
            `).join('');
        }
    } catch (error) {
        console.error('Error loading tasks:', error);
    }
}

async function loadTeam() {
    try {
        const response = await fetch('/api/users');
        const users = await response.json();
        
        const teamList = document.getElementById('team-members-list');
        teamList.innerHTML = `
            <div class="team-grid">
                ${users.map(user => `
                    <div class="team-card">
                        <i class="fas fa-user-circle"></i>
                        <h4>${user.username}</h4>
                        <p>${user.email}</p>
                        <span class="role-badge ${user.role}">${user.role}</span>
                    </div>
                `).join('')}
            </div>
        `;
    } catch (error) {
        console.error('Error loading team:', error);
    }
}

async function updateTaskStatus(taskId, status) {
    try {
        const response = await fetch(`/api/tasks/${taskId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status})
        });
        
        if (response.ok) {
            showNotification('Task status updated!', 'success');
            loadTasks();
            loadDashboard();
        } else {
            showNotification('Failed to update status', 'error');
        }
    } catch (error) {
        showNotification('Error updating task status', 'error');
    }
}

async function deleteTask(taskId) {
    if (confirm('Are you sure you want to delete this task?')) {
        try {
            const response = await fetch(`/api/tasks/${taskId}`, {method: 'DELETE'});
            if (response.ok) {
                showNotification('Task deleted successfully!', 'success');
                loadTasks();
                loadDashboard();
            } else {
                showNotification('Failed to delete task', 'error');
            }
        } catch (error) {
            showNotification('Error deleting task', 'error');
        }
    }
}

async function deleteProject(projectId) {
    if (confirm('Are you sure you want to delete this project? All tasks will be deleted!')) {
        try {
            const response = await fetch(`/api/projects/${projectId}`, {method: 'DELETE'});
            if (response.ok) {
                showNotification('Project deleted successfully!', 'success');
                loadProjects();
                loadDashboard();
            } else {
                showNotification('Failed to delete project', 'error');
            }
        } catch (error) {
            showNotification('Error deleting project', 'error');
        }
    }
}

function showSection(sectionName, btnElement) {
    // Hide all sections
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    
    // Show selected section
    document.getElementById(`${sectionName}-section`).classList.add('active');
    
    // Update active menu button
    document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
    if (btnElement) {
        btnElement.classList.add('active');
    }
    
    // Load section data
    if (sectionName === 'dashboard') loadDashboard();
    else if (sectionName === 'projects') loadProjects();
    else if (sectionName === 'tasks') loadTasks();
    else if (sectionName === 'team') loadTeam();
}

async function showCreateProjectModal() {
    document.getElementById('project-modal').style.display = 'block';
}

async function showCreateTaskModal() {
    await loadProjectsForSelect();
    await loadUsersForSelect();
    document.getElementById('task-modal').style.display = 'block';
}

async function loadProjectsForSelect() {
    try {
        const response = await fetch('/api/projects');
        const projects = await response.json();
        const select = document.getElementById('task-project');
        select.innerHTML = '<option value="">Select Project</option>' + 
            projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    } catch (error) {
        console.error('Error loading projects:', error);
    }
}

async function loadUsersForSelect() {
    try {
        const response = await fetch('/api/users');
        const users = await response.json();
        const select = document.getElementById('task-assignee');
        select.innerHTML = '<option value="">Assign To</option>' + 
            users.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
    } catch (error) {
        console.error('Error loading users:', error);
    }
}

async function createProject(event) {
    event.preventDefault();
    const name = document.getElementById('project-name').value;
    const description = document.getElementById('project-desc').value;
    
    try {
        const response = await fetch('/api/projects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, description})
        });
        
        if (response.ok) {
            closeModal('project-modal');
            document.getElementById('project-form').reset();
            showNotification('Project created successfully!', 'success');
            loadProjects();
            loadDashboard();
        } else {
            const data = await response.json();
            showNotification(data.error || 'Failed to create project', 'error');
        }
    } catch (error) {
        showNotification('Error creating project', 'error');
    }
}

async function createTask(event) {
    event.preventDefault();
    const title = document.getElementById('task-title').value;
    const description = document.getElementById('task-desc').value;
    const project_id = parseInt(document.getElementById('task-project').value);
    const assigned_to = parseInt(document.getElementById('task-assignee').value);
    const priority = document.getElementById('task-priority').value;
    const due_date = document.getElementById('task-due-date').value;
    
    if (!due_date) {
        showNotification('Please select due date', 'error');
        return;
    }
    
    try {
        const response = await fetch('/api/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, description, project_id, assigned_to, priority, due_date})
        });
        
        if (response.ok) {
            closeModal('task-modal');
            document.getElementById('task-form').reset();
            showNotification('Task created successfully!', 'success');
            loadTasks();
            loadDashboard();
        } else {
            const data = await response.json();
            showNotification(data.error || 'Failed to create task', 'error');
        }
    } catch (error) {
        showNotification('Error creating task', 'error');
    }
}

function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
}

async function handleLogout() {
    try {
        const response = await fetch('/api/logout', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        });
        
        if (response.ok) {
            showNotification('Logged out successfully!', 'success');
            setTimeout(() => {
                window.location.href = '/';
            }, 500);
        } else {
            showNotification('Logout failed', 'error');
        }
    } catch (error) {
        showNotification('Error during logout', 'error');
    }
}

// Close modals when clicking outside
window.onclick = function(event) {
    if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
    }
}

// Auto-refresh every 30 seconds
setInterval(() => {
    if (document.getElementById('dashboard-section').classList.contains('active')) {
        loadDashboard();
    } else if (document.getElementById('projects-section').classList.contains('active')) {
        loadProjects();
    } else if (document.getElementById('tasks-section').classList.contains('active')) {
        loadTasks();
    } else if (document.getElementById('team-section').classList.contains('active')) {
        loadTeam();
    }
}, 30000);

// Initialize
loadUserInfo();
loadDashboard();
</script>
{% endblock %}
